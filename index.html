<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>CodeConnect</title>
</head>

<body>
    <aside>
        <img src="./img/Logo.svg" alt="logo da code connect">
        <nav>
            <ul class="list-links">
                <li>
                    <a href="#" class="list-links-button">Publicar</a>
                </li>
                <li>
                    
                    <a href="#">
                        <img src="./img/feed.svg" alt="feed">
                        Feed
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="./img/account_circle.svg" alt="perfil">
                        Perfil
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="./img/info.svg" alt="about us">
                        Sobre nós
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="./img/logout.svg" alt="logout">
                        Sair
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main>
        <div class="container-upload-image">
            <div class="container-image">
                <img src="./img/imagem1.png" alt="" class="main-image">
            </div>
            <button id="upload-btn">Carregar Imagem</button>
            <input type="file" id="image-upload" accept="image/" style="display: none" />
            <div class="container-image-name">
                <p>image_projeto.png</p>
                <img src="./img/close.svg" alt="">
            </div>
        </div>
        <div class="container-description">
            <h2>Novo Projeto</h2>
            <form>
                <div>
                    <label for="name">Nome do Projeto</label>
                    <input type="text" id="name" name="name" />
                </div>
                <div>
                    <label for="description">Descrição</label>
                    <textarea name="description" id="description"></textarea>
                </div>
                <div>
                    <label for="category">Tags</label>
                    <input type="text" id="category" name="category" />
                </div>
                <ul class="list-tags" id="list-tags"></ul>
                <div class="container-buttons">
                    <button class="button-discard">Descartar</button>
                    <button class="button-publish">Publicar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
